<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Helvetica, Arial, sans-serif">
  <text x="350" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">SAME MISMATCH, DIFFERENT DURATION</text>

  <!-- column headers -->
  <text x="185" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">PERMANENT</text>
  <text x="405" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">TEMPORARY</text>
  <text x="620" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">SITUATIONAL</text>

  <!-- row label -->
  <text x="45" y="105" font-size="12" font-weight="700" fill="#374151">Vision</text>
  <!-- row 1 boxes -->
  <rect x="90" y="80" width="190" height="55" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="185" y="112" text-anchor="middle" font-size="12" fill="#7f1d1d">One eye</text>
  <rect x="310" y="80" width="190" height="55" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="405" y="112" text-anchor="middle" font-size="12" fill="#78350f">Cataract surgery</text>
  <rect x="530" y="80" width="180" height="55" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="620" y="112" text-anchor="middle" font-size="12" fill="#1e3a8a">Glare on screen outdoors</text>

  <!-- row label -->
  <text x="35" y="175" font-size="12" font-weight="700" fill="#374151">Hearing</text>
  <rect x="90" y="150" width="190" height="55" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="185" y="182" text-anchor="middle" font-size="12" fill="#7f1d1d">Deaf</text>
  <rect x="310" y="150" width="190" height="55" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="405" y="182" text-anchor="middle" font-size="12" fill="#78350f">Ear infection</text>
  <rect x="530" y="150" width="180" height="55" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="620" y="182" text-anchor="middle" font-size="12" fill="#1e3a8a">Loud bar/factory floor</text>

  <!-- row label -->
  <text x="30" y="245" font-size="12" font-weight="700" fill="#374151">Mobility</text>
  <rect x="90" y="220" width="190" height="55" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="185" y="252" text-anchor="middle" font-size="12" fill="#7f1d1d">Missing arm</text>
  <rect x="310" y="220" width="190" height="55" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="405" y="252" text-anchor="middle" font-size="12" fill="#78350f">Arm injury/cast</text>
  <rect x="530" y="220" width="180" height="55" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="620" y="245" text-anchor="middle" font-size="12" fill="#1e3a8a">Holding a baby /</text>
  <text x="620" y="260" text-anchor="middle" font-size="12" fill="#1e3a8a">carrying groceries</text>
</svg>
