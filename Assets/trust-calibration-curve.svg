<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="Helvetica, Arial, sans-serif">
  <text x="350" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Trust calibration</text>

  <!-- axes -->
  <line x1="80" y1="280" x2="80" y2="50" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowAxis)"/>
  <line x1="80" y1="280" x2="640" y2="280" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowAxis)"/>
  <text x="40" y="60" font-size="11" fill="#374151">Trust</text>
  <text x="640" y="300" text-anchor="end" font-size="11" fill="#374151">Actual system reliability →</text>

  <!-- calibrated diagonal -->
  <line x1="80" y1="280" x2="620" y2="70" stroke="#047857" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="430" y="140" font-size="11" fill="#065f46" transform="rotate(-24 430 140)">well-calibrated: trust tracks reliability</text>

  <!-- over-trust zone -->
  <path d="M80,180 C 250,120 450,70 620,50 L620,50 L80,90 Z" fill="#fee2e2" opacity="0.5"/>
  <text x="180" y="90" font-size="11" font-weight="700" fill="#b91c1c">⚠ over-trust / automation bias</text>
  <text x="180" y="106" font-size="10" fill="#991b1b">user stops verifying, misses errors</text>

  <!-- under-trust zone -->
  <path d="M80,280 C 250,270 450,240 620,220 L620,260 L80,280 Z" fill="#fef3c7" opacity="0.6"/>
  <text x="330" y="255" font-size="11" font-weight="700" fill="#92400e">⚠ under-trust / algorithm aversion</text>
  <text x="330" y="271" font-size="10" fill="#78350f">good suggestions ignored, feature unused</text>

  <defs>
    <marker id="arrowAxis" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
</svg>
