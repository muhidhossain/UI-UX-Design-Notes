<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Helvetica, Arial, sans-serif">
  <text x="350" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Closing the feedback loop</text>

  <!-- Capture -->
  <rect x="30" y="110" width="120" height="55" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="90" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Capture</text>
  <text x="90" y="150" text-anchor="middle" font-size="9" fill="#1e40af">at point of use</text>

  <line x1="150" y1="137" x2="185" y2="137" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowLoop)"/>

  <!-- Aggregate -->
  <rect x="190" y="110" width="120" height="55" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="250" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Aggregate</text>
  <text x="250" y="150" text-anchor="middle" font-size="9" fill="#047857">across users</text>

  <line x1="310" y1="137" x2="345" y2="137" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowLoop)"/>

  <!-- Retrain -->
  <rect x="350" y="110" width="120" height="55" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="410" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Retrain / tune</text>
  <text x="410" y="150" text-anchor="middle" font-size="9" fill="#92400e">slow, async</text>

  <line x1="470" y1="137" x2="505" y2="137" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowLoop)"/>

  <!-- Redeploy -->
  <rect x="510" y="110" width="120" height="55" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="570" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Redeploy</text>
  <text x="570" y="150" text-anchor="middle" font-size="9" fill="#5b21b6">ship update</text>

  <!-- Observe (below, looping back) -->
  <rect x="270" y="215" width="120" height="55" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="330" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Observe</text>
  <text x="330" y="255" text-anchor="middle" font-size="9" fill="#991b1b">watch real usage</text>

  <!-- connectors down and back -->
  <path d="M570,165 L570,242 L390,242" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowLoop)"/>
  <path d="M270,242 L90,242 L90,165" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowLoop)"/>

  <defs>
    <marker id="arrowLoop" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
