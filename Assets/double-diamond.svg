<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ddArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- center line -->
  <line x1="20" y1="130" x2="880" y2="130" stroke="#d1d5db" stroke-width="1"/>

  <!-- Diamond 1: Discover -->
  <polygon points="30,130 220,40 220,220" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <!-- Diamond 1: Define -->
  <polygon points="220,40 220,220 410,130" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>

  <!-- Diamond 2: Develop -->
  <polygon points="450,130 640,40 640,220" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <!-- Diamond 2: Deliver -->
  <polygon points="640,40 640,220 830,130" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>

  <!-- connecting arrow between diamonds -->
  <line x1="410" y1="130" x2="446" y2="130" stroke="#6b7280" stroke-width="2" marker-end="url(#ddArrow)"/>

  <!-- top labels: diverge/converge -->
  <g font-size="13" font-weight="600" fill="#6b7280" text-anchor="middle">
    <text x="125" y="25">DIVERGE</text>
    <text x="315" y="25">CONVERGE</text>
    <text x="545" y="25">DIVERGE</text>
    <text x="735" y="25">CONVERGE</text>
  </g>

  <!-- phase labels inside/below diamonds -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <text x="125" y="135" fill="#1e1b4b">Discover</text>
    <text x="315" y="135" fill="#1e3a8a">Define</text>
    <text x="545" y="135" fill="#064e3b">Develop</text>
    <text x="735" y="135" fill="#7f1d1d">Deliver</text>
  </g>

  <!-- design thinking phase mapping below -->
  <g font-size="12" fill="#4b5563" text-anchor="middle" font-style="italic">
    <text x="125" y="245">Empathize</text>
    <text x="315" y="245">Define</text>
    <text x="545" y="245">Ideate</text>
    <text x="735" y="245">Prototype / Test</text>
  </g>

  <text x="450" y="290" text-anchor="middle" font-size="12" fill="#9ca3af">Define's convergent output (the POV) becomes Ideate's divergent input (the HMW)</text>
</svg>
