<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/>
    </marker>
  </defs>

  <!-- Phase boxes -->
  <g font-size="16" font-weight="600" text-anchor="middle">
    <!-- Empathize -->
    <rect x="20" y="70" width="150" height="70" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <text x="95" y="100" fill="#1e1b4b">Empathize</text>
    <text x="95" y="120" font-size="11" font-weight="400" fill="#4338ca">understand</text>

    <!-- Define -->
    <rect x="212" y="70" width="150" height="70" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="287" y="100" fill="#1e3a8a">Define</text>
    <text x="287" y="120" font-size="11" font-weight="400" fill="#1d4ed8">frame</text>

    <!-- Ideate -->
    <rect x="404" y="70" width="150" height="70" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <text x="479" y="100" fill="#064e3b">Ideate</text>
    <text x="479" y="120" font-size="11" font-weight="400" fill="#047857">generate</text>

    <!-- Prototype -->
    <rect x="596" y="70" width="150" height="70" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text x="671" y="100" fill="#78350f">Prototype</text>
    <text x="671" y="120" font-size="11" font-weight="400" fill="#b45309">build</text>

    <!-- Test -->
    <rect x="788" y="70" width="112" height="70" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="844" y="100" fill="#7f1d1d">Test</text>
    <text x="844" y="120" font-size="11" font-weight="400" fill="#b91c1c">learn</text>
  </g>

  <!-- Forward arrows -->
  <g stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)">
    <line x1="170" y1="105" x2="208" y2="105"/>
    <line x1="362" y1="105" x2="400" y2="105"/>
    <line x1="554" y1="105" x2="592" y2="105"/>
    <line x1="746" y1="105" x2="784" y2="105"/>
  </g>

  <!-- Iterate loop-back arrow -->
  <path d="M 844 140 C 844 220, 95 220, 95 144" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowLoop)"/>
  <text x="470" y="240" text-anchor="middle" font-size="13" fill="#9333ea" font-style="italic">iterate — loop back to any earlier phase as needed</text>
</svg>
