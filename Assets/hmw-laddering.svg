<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ladderArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- vertical axis -->
  <line x1="60" y1="30" x2="60" y2="310" stroke="#9ca3af" stroke-width="2" marker-end="url(#ladderArrow)"/>
  <text x="60" y="20" text-anchor="middle" font-size="13" fill="#6b7280" font-weight="600">broader</text>
  <text x="60" y="330" text-anchor="middle" font-size="13" fill="#6b7280" font-weight="600">narrower</text>

  <!-- broad HMW -->
  <rect x="130" y="30" width="600" height="60" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="430" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">"How might we help new employees</text>
  <text x="430" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">feel like they belong?"</text>

  <text x="430" y="115" text-anchor="middle" font-size="12" font-style="italic" fill="#6b7280">ladder up — ask "why?" — broadens scope</text>

  <!-- middle HMW (the working POV-derived one) -->
  <rect x="130" y="140" width="600" height="60" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="430" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">"How might we make asking questions feel safe</text>
  <text x="430" y="193" text-anchor="middle" font-size="13" fill="#064e3b">for new employees?"</text>

  <text x="430" y="230" text-anchor="middle" font-size="12" font-style="italic" fill="#6b7280">ladder down — ask "what's stopping that?" — narrows scope</text>

  <!-- narrow HMW -->
  <rect x="130" y="250" width="600" height="70" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="430" y="278" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">"How might we make it obvious no question is dumb</text>
  <text x="430" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">in the first team meeting?"</text>
</svg>
