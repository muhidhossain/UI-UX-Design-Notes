<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="Helvetica, Arial, sans-serif">
  <!-- outer HCD boundary -->
  <rect x="20" y="20" width="660" height="280" rx="16" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="350" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b4b">Human-Centered Design (philosophy)</text>
  <text x="350" y="66" text-anchor="middle" font-size="11" font-style="italic" fill="#4338ca">"ground design in real human understanding"</text>

  <!-- Design Thinking box -->
  <rect x="55" y="95" width="230" height="100" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="170" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">Design Thinking</text>
  <text x="170" y="150" text-anchor="middle" font-size="11" fill="#047857">(IDEO / d.school)</text>
  <text x="170" y="168" text-anchor="middle" font-size="11" fill="#047857">5-phase innovation</text>
  <text x="170" y="184" text-anchor="middle" font-size="11" fill="#047857">process</text>

  <!-- Human Factors box -->
  <rect x="415" y="95" width="230" height="100" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="530" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Human Factors /</text>
  <text x="530" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Ergonomics</text>
  <text x="530" y="170" text-anchor="middle" font-size="11" fill="#b45309">usability, safety,</text>
  <text x="530" y="186" text-anchor="middle" font-size="11" fill="#b45309">physical/cognitive fit</text>

  <!-- Lean UX box -->
  <rect x="235" y="220" width="230" height="60" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="350" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Lean UX, etc.</text>
  <text x="350" y="263" text-anchor="middle" font-size="11" fill="#b91c1c">other HCD-based methods</text>
</svg>
