<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Helvetica, Arial, sans-serif">
  <!-- front-stage band -->
  <rect x="40" y="40" width="620" height="90" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="60" y="65" font-size="13" font-weight="700" fill="#1e3a8a">FRONT-STAGE (journey map)</text>
  <text x="60" y="90" font-size="12" fill="#1e3a8a">User sees: checkout page,</text>
  <text x="60" y="108" font-size="12" fill="#1e3a8a">"Payment failed" error</text>

  <!-- line of visibility -->
  <line x1="40" y1="150" x2="660" y2="150" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="350" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">line of visibility</text>

  <!-- back-stage band -->
  <rect x="40" y="165" width="620" height="70" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="60" y="188" font-size="13" font-weight="700" fill="#78350f">BACK-STAGE (added by service blueprint)</text>
  <text x="60" y="210" font-size="12" fill="#78350f">Support agent manually reviews failed transactions</text>
  <text x="60" y="225" font-size="12" fill="#78350f">(visible to staff, not the user)</text>

  <!-- line of internal interaction -->
  <line x1="40" y1="248" x2="660" y2="248" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="350" y="242" text-anchor="middle" font-size="11" fill="#6b7280">line of internal interaction</text>

  <!-- support systems -->
  <rect x="40" y="255" width="620" height="35" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="60" y="277" font-size="12" fill="#374151">Support systems: payment gateway API, fraud-detection service, inventory DB</text>
</svg>
