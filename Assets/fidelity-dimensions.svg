<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="fadeVisual" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="fadeInteraction" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="fadeContent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <text x="20" y="25" font-size="13" font-weight="700" fill="#374151">LOW</text>
  <text x="740" y="25" font-size="13" font-weight="700" fill="#374151" text-anchor="end">HIGH</text>

  <!-- Visual fidelity -->
  <text x="20" y="55" font-size="14" font-weight="600" fill="#1e1b4b">Visual</text>
  <rect x="150" y="42" width="590" height="16" rx="8" fill="url(#fadeVisual)"/>
  <circle cx="255" cy="50" r="8" fill="#1e1b4b" stroke="white" stroke-width="2"/>
  <text x="255" y="80" font-size="11" fill="#6b7280" text-anchor="middle">gray boxes</text>

  <!-- Interaction fidelity -->
  <text x="20" y="115" font-size="14" font-weight="600" fill="#064e3b">Interaction</text>
  <rect x="150" y="102" width="590" height="16" rx="8" fill="url(#fadeInteraction)"/>
  <circle cx="640" cy="110" r="8" fill="#064e3b" stroke="white" stroke-width="2"/>
  <text x="640" y="140" font-size="11" fill="#6b7280" text-anchor="middle">clickable, real states</text>

  <!-- Content fidelity -->
  <text x="20" y="175" font-size="14" font-weight="600" fill="#78350f">Content</text>
  <rect x="150" y="162" width="590" height="16" rx="8" fill="url(#fadeContent)"/>
  <circle cx="220" cy="170" r="8" fill="#78350f" stroke="white" stroke-width="2"/>
  <text x="220" y="200" font-size="11" fill="#6b7280" text-anchor="middle">placeholder text</text>

  <text x="380" y="235" text-anchor="middle" font-size="12" font-style="italic" fill="#9ca3af">Example: a clickable wireframe — low visual, high interaction, low content fidelity</text>
</svg>
