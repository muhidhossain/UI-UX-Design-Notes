<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Helvetica, Arial, sans-serif">
  <text x="320" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">EVALUATIVE METHODS</text>

  <!-- shared top bracket -->
  <line x1="170" y1="55" x2="470" y2="55" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="170" y1="55" x2="170" y2="75" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="470" y1="55" x2="470" y2="75" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="320" y1="55" x2="320" y2="75" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Heuristic evaluation box -->
  <rect x="60" y="90" width="230" height="170" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="175" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Heuristic Evaluation</text>
  <text x="80" y="150" font-size="12" fill="#1e3a8a">• Needs a trained evaluator,</text>
  <text x="95" y="168" font-size="12" fill="#1e3a8a">not real users</text>
  <text x="80" y="195" font-size="12" fill="#1e3a8a">• Fast &amp; cheap; run early/often</text>
  <text x="80" y="220" font-size="12" fill="#1e3a8a">• Finds violations of known</text>
  <text x="95" y="238" font-size="12" fill="#1e3a8a">principles</text>

  <!-- Usability testing box -->
  <rect x="350" y="90" width="230" height="170" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="465" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Usability Testing</text>
  <text x="370" y="150" font-size="12" fill="#7f1d1d">• Needs real users</text>
  <text x="370" y="177" font-size="12" fill="#7f1d1d">• Slower &amp; costlier to run</text>
  <text x="370" y="204" font-size="12" fill="#7f1d1d">• Finds unanticipated problems</text>
  <text x="385" y="222" font-size="12" fill="#7f1d1d">no checklist predicts</text>

  <text x="320" y="295" text-anchor="middle" font-size="12" fill="#9ca3af">Complementary, not substitutes: cheap checklist coverage + real-user discovery</text>
</svg>
