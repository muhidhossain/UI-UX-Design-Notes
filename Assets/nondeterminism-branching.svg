<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="Helvetica, Arial, sans-serif">
  <text x="170" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Traditional feature</text>
  <rect x="30" y="105" width="70" height="30" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="65" y="125" text-anchor="middle" font-size="11" fill="#374151">input</text>
  <line x1="100" y1="120" x2="150" y2="120" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowGray1)"/>
  <rect x="150" y="105" width="100" height="30" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="200" y="125" text-anchor="middle" font-size="10" fill="#1e3a8a">fixed logic</text>
  <line x1="250" y1="120" x2="300" y2="120" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowGray1)"/>
  <rect x="300" y="105" width="70" height="30" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="335" y="125" text-anchor="middle" font-size="11" fill="#374151">output</text>
  <text x="200" y="160" text-anchor="middle" font-size="10" fill="#6b7280">same input → same output, every time</text>

  <line x1="400" y1="20" x2="400" y2="240" stroke="#e5e7eb" stroke-width="1.5"/>

  <text x="540" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">AI feature</text>
  <rect x="430" y="105" width="70" height="30" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="465" y="125" text-anchor="middle" font-size="11" fill="#374151">input</text>
  <line x1="500" y1="120" x2="550" y2="120" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowGray1)"/>
  <rect x="550" y="105" width="100" height="30" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="600" y="125" text-anchor="middle" font-size="10" fill="#4c1d95">model, sampled</text>

  <line x1="650" y1="115" x2="680" y2="75" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <rect x="530" y="60" width="150" height="26" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="605" y="78" text-anchor="middle" font-size="10" fill="#4c1d95">output A</text>

  <line x1="650" y1="120" x2="685" y2="120" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <rect x="530" y="107" width="150" height="26" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="605" y="125" text-anchor="middle" font-size="10" fill="#4c1d95">output B</text>

  <line x1="650" y1="125" x2="680" y2="165" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <rect x="530" y="154" width="150" height="26" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="605" y="172" text-anchor="middle" font-size="10" fill="#4c1d95">output C</text>

  <text x="540" y="215" text-anchor="middle" font-size="10" fill="#6b7280">same input → output varies run to run</text>

  <defs>
    <marker id="arrowGray1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b7280"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>
</svg>
