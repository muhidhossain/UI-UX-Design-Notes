<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="axisArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="110" y1="60" x2="110" y2="380" stroke="#9ca3af" stroke-width="2"/>
  <line x1="110" y1="60" x2="690" y2="60" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="110" y1="380" x2="690" y2="380" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="400" y1="60" x2="400" y2="380" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- axis labels -->
  <text x="30" y="150" font-size="13" font-weight="700" fill="#374151" text-anchor="middle" transform="rotate(-90 30 150)">QUALITATIVE</text>
  <text x="30" y="320" font-size="13" font-weight="700" fill="#374151" text-anchor="middle" transform="rotate(-90 30 320)">QUANTITATIVE</text>

  <text x="255" y="35" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">GENERATIVE (before a solution)</text>
  <text x="545" y="35" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">EVALUATIVE (testing a solution)</text>

  <!-- Quadrant 1: qualitative + generative -->
  <rect x="130" y="80" width="250" height="140" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="255" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">Interviews</text>
  <text x="255" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">Contextual inquiry</text>

  <!-- Quadrant 2: qualitative + evaluative -->
  <rect x="420" y="80" width="250" height="140" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="545" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Usability testing</text>
  <text x="545" y="175" text-anchor="middle" font-size="11" fill="#b91c1c">(separate topic)</text>

  <!-- Quadrant 3: quantitative + generative -->
  <rect x="130" y="240" width="250" height="120" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="255" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Surveys</text>
  <text x="255" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Analytics</text>

  <!-- Quadrant 4: quantitative + evaluative -->
  <rect x="420" y="240" width="250" height="120" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="545" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">A/B tests</text>
  <text x="545" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Analytics dashboards</text>

  <text x="400" y="405" text-anchor="middle" font-size="12" fill="#9ca3af">This doc focuses on the generative-qualitative quadrant (top-left)</text>
</svg>
