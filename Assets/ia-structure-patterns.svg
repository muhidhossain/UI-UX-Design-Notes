<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" font-family="Helvetica, Arial, sans-serif">
  <!-- Hierarchy -->
  <rect x="20" y="20" width="320" height="200" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="40" y="45" font-size="13" font-weight="700" fill="#1e3a8a">HIERARCHY (tree)</text>

  <rect x="150" y="60" width="60" height="26" rx="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="180" y="77" text-anchor="middle" font-size="11" fill="#1e3a8a">Home</text>

  <rect x="80" y="120" width="70" height="26" rx="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="115" y="137" text-anchor="middle" font-size="11" fill="#1e3a8a">Cat A</text>
  <rect x="240" y="120" width="70" height="26" rx="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="275" y="137" text-anchor="middle" font-size="11" fill="#1e3a8a">Cat B</text>

  <rect x="45" y="175" width="55" height="24" rx="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="72" y="191" text-anchor="middle" font-size="10" fill="#1e3a8a">Sub 1</text>
  <rect x="110" y="175" width="55" height="24" rx="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="137" y="191" text-anchor="middle" font-size="10" fill="#1e3a8a">Sub 2</text>
  <rect x="240" y="175" width="70" height="24" rx="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="275" y="191" text-anchor="middle" font-size="10" fill="#1e3a8a">Sub 3</text>

  <line x1="180" y1="86" x2="115" y2="120" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="180" y1="86" x2="275" y2="120" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="115" y1="146" x2="72" y2="175" stroke="#1d4ed8" stroke-width="1.2"/>
  <line x1="115" y1="146" x2="137" y2="175" stroke="#1d4ed8" stroke-width="1.2"/>
  <line x1="275" y1="146" x2="275" y2="175" stroke="#1d4ed8" stroke-width="1.2"/>

  <!-- Sequence -->
  <rect x="360" y="20" width="320" height="200" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="380" y="45" font-size="13" font-weight="700" fill="#78350f">SEQUENCE (linear)</text>

  <rect x="390" y="100" width="70" height="30" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="425" y="120" text-anchor="middle" font-size="11" fill="#78350f">Step 1</text>
  <rect x="490" y="100" width="70" height="30" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="525" y="120" text-anchor="middle" font-size="11" fill="#78350f">Step 2</text>
  <rect x="590" y="100" width="70" height="30" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="625" y="120" text-anchor="middle" font-size="11" fill="#78350f">Step 3</text>

  <line x1="460" y1="115" x2="490" y2="115" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <line x1="560" y1="115" x2="590" y2="115" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="525" y="165" text-anchor="middle" font-size="10" fill="#92400e">e.g. checkout, onboarding wizard</text>

  <!-- Matrix -->
  <rect x="20" y="240" width="320" height="200" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="40" y="265" font-size="13" font-weight="700" fill="#065f46">MATRIX (multi-axis filter)</text>

  <rect x="60" y="290" width="240" height="24" rx="5" fill="#ffffff" stroke="#047857" stroke-width="1.2"/>
  <text x="180" y="307" text-anchor="middle" font-size="10" fill="#065f46">Filter by: Color · Size · Price</text>

  <rect x="60" y="330" width="70" height="26" rx="5" fill="#ffffff" stroke="#047857" stroke-width="1.2"/>
  <text x="95" y="347" text-anchor="middle" font-size="10" fill="#065f46">Red / S-M-L</text>
  <rect x="140" y="330" width="70" height="26" rx="5" fill="#ffffff" stroke="#047857" stroke-width="1.2"/>
  <text x="175" y="347" text-anchor="middle" font-size="10" fill="#065f46">Blue / S-M-L</text>
  <rect x="220" y="330" width="80" height="26" rx="5" fill="#ffffff" stroke="#047857" stroke-width="1.2"/>
  <text x="260" y="347" text-anchor="middle" font-size="10" fill="#065f46">Green / S-M-L</text>
  <text x="180" y="400" text-anchor="middle" font-size="10" fill="#065f46">e.g. e-commerce product listings</text>

  <!-- Hub and spoke -->
  <rect x="360" y="240" width="320" height="200" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="380" y="265" font-size="13" font-weight="700" fill="#4c1d95">HUB-AND-SPOKE</text>

  <circle cx="520" cy="345" r="30" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="520" y="349" text-anchor="middle" font-size="11" fill="#4c1d95">Hub</text>

  <rect x="500" y="270" width="70" height="26" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="535" y="287" text-anchor="middle" font-size="10" fill="#4c1d95">Detail A</text>
  <rect x="580" y="330" width="70" height="26" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="615" y="347" text-anchor="middle" font-size="10" fill="#4c1d95">Detail B</text>
  <rect x="500" y="390" width="70" height="26" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="535" y="407" text-anchor="middle" font-size="10" fill="#4c1d95">Detail C</text>
  <rect x="390" y="330" width="70" height="26" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="425" y="347" text-anchor="middle" font-size="10" fill="#4c1d95">Detail D</text>

  <line x1="520" y1="315" x2="535" y2="296" stroke="#7c3aed" stroke-width="1.2"/>
  <line x1="548" y1="345" x2="580" y2="345" stroke="#7c3aed" stroke-width="1.2"/>
  <line x1="520" y1="375" x2="535" y2="390" stroke="#7c3aed" stroke-width="1.2"/>
  <line x1="492" y1="345" x2="460" y2="345" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="520" y="435" text-anchor="middle" font-size="10" fill="#4c1d95">e.g. mobile app dashboard/home screen</text>

  <defs>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
