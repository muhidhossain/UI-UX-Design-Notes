<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 220" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pipeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Step 1: raw research -->
  <rect x="20" y="70" width="170" height="80" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="105" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">Interviews /</text>
  <text x="105" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">Surveys</text>
  <text x="105" y="180" text-anchor="middle" font-size="11" fill="#6b7280">raw data</text>

  <line x1="190" y1="110" x2="235" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#pipeArrow)"/>

  <!-- Step 2: empathy maps -->
  <rect x="240" y="60" width="180" height="100" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="330" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Empathy Maps</text>
  <text x="330" y="115" text-anchor="middle" font-size="11" fill="#1e3a8a">(one per participant,</text>
  <text x="330" y="132" text-anchor="middle" font-size="11" fill="#1e3a8a">fast synthesis)</text>
  <text x="330" y="185" text-anchor="middle" font-size="11" fill="#6b7280">per-person snapshot</text>

  <line x1="420" y1="110" x2="465" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#pipeArrow)"/>

  <!-- Step 3: patterns -->
  <rect x="470" y="70" width="150" height="80" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="545" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Look for</text>
  <text x="545" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">clusters/patterns</text>

  <line x1="620" y1="110" x2="665" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#pipeArrow)"/>

  <!-- Step 4: personas -->
  <rect x="670" y="55" width="95" height="110" rx="10" fill="#fdf4ff" stroke="#a21caf" stroke-width="2"/>
  <text x="717" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#701a75">Personas</text>
  <text x="717" y="118" text-anchor="middle" font-size="10" fill="#701a75">(composite,</text>
  <text x="717" y="132" text-anchor="middle" font-size="10" fill="#701a75">reusable)</text>

  <text x="390" y="210" text-anchor="middle" font-size="11" fill="#9ca3af">Empathy maps sit close to raw data; personas are the reusable, downstream artifact</text>
</svg>
