<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Helvetica, Arial, sans-serif">
  <text x="320" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">The graceful degradation ladder</text>

  <!-- Rung 1 -->
  <rect x="100" y="45" width="440" height="55" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="120" y="68" font-size="12" font-weight="700" fill="#065f46">1. Ideal</text>
  <text x="120" y="86" font-size="11" fill="#065f46">Confident, correct answer</text>

  <line x1="320" y1="100" x2="320" y2="120" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowLadder)"/>
  <text x="335" y="114" font-size="9" fill="#6b7280">confidence drops</text>

  <!-- Rung 2 -->
  <rect x="100" y="125" width="440" height="55" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="120" y="148" font-size="12" font-weight="700" fill="#1e3a8a">2. Honest degrade</text>
  <text x="120" y="166" font-size="11" fill="#1e3a8a">Uncertain answer, clearly flagged</text>

  <line x1="320" y1="180" x2="320" y2="200" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowLadder)"/>
  <text x="335" y="194" font-size="9" fill="#6b7280">too low to show at all</text>

  <!-- Rung 3 -->
  <rect x="100" y="205" width="440" height="55" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="120" y="228" font-size="12" font-weight="700" fill="#78350f">3. Deterministic fallback</text>
  <text x="120" y="246" font-size="11" fill="#78350f">e.g. keyword search instead of semantic search</text>

  <line x1="320" y1="260" x2="320" y2="280" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowLadder)"/>
  <text x="335" y="274" font-size="9" fill="#6b7280">even the fallback can't serve it</text>

  <!-- Rung 4 -->
  <rect x="100" y="285" width="440" height="55" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="120" y="308" font-size="12" font-weight="700" fill="#4c1d95">4. Escape hatch</text>
  <text x="120" y="326" font-size="11" fill="#4c1d95">Explicit manual path ("search manually", "talk to a person")</text>

  <line x1="320" y1="340" x2="320" y2="360" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowLadder)"/>
  <text x="335" y="354" font-size="9" fill="#6b7280">nothing works</text>

  <!-- Rung 5 -->
  <rect x="100" y="365" width="440" height="55" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="120" y="388" font-size="12" font-weight="700" fill="#7f1d1d">5. Clear failure</text>
  <text x="120" y="406" font-size="11" fill="#7f1d1d">Honest error message + a concrete next step</text>

  <defs>
    <marker id="arrowLadder" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
