<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Helvetica, Arial, sans-serif">
  <text x="350" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Staged autonomy rollout during onboarding</text>

  <!-- axes -->
  <line x1="80" y1="250" x2="80" y2="55" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowStage)"/>
  <line x1="80" y1="250" x2="650" y2="250" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowStage)"/>
  <text x="35" y="65" font-size="11" fill="#374151">Autonomy granted</text>
  <text x="650" y="270" text-anchor="end" font-size="11" fill="#374151">Trust earned over time / interactions →</text>

  <!-- staircase steps -->
  <path d="M80,230 L200,230 L200,175 L340,175 L340,120 L480,120 L480,70 L620,70"
        fill="none" stroke="#7c3aed" stroke-width="3"/>

  <!-- step labels -->
  <rect x="90" y="205" width="100" height="22" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="140" y="220" text-anchor="middle" font-size="10" fill="#1e3a8a">Suggestion</text>

  <rect x="210" y="150" width="120" height="22" rx="5" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <text x="270" y="165" text-anchor="middle" font-size="10" fill="#065f46">Autocomplete</text>

  <rect x="350" y="95" width="120" height="22" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="410" y="110" text-anchor="middle" font-size="10" fill="#78350f">Copilot</text>

  <rect x="490" y="45" width="120" height="22" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="550" y="60" text-anchor="middle" font-size="10" fill="#4c1d95">Agent</text>

  <!-- milestone markers -->
  <text x="140" y="245" text-anchor="middle" font-size="9" fill="#6b7280">first-run,</text>
  <text x="140" y="257" text-anchor="middle" font-size="9" fill="#6b7280">"show your work"</text>

  <text x="550" y="285" text-anchor="middle" font-size="9" fill="#6b7280">high-autonomy mode earned, not default</text>

  <defs>
    <marker id="arrowStage" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
</svg>
