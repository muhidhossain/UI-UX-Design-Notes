<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="Helvetica, Arial, sans-serif">
  <text x="360" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Matching explanation depth to audience</text>

  <!-- End user -->
  <rect x="40" y="55" width="190" height="90" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="135" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">END USER</text>
  <text x="135" y="98" text-anchor="middle" font-size="10" fill="#1e40af">"Why am I seeing this?"</text>
  <text x="135" y="115" text-anchor="middle" font-size="10" fill="#1e40af">simple, one line,</text>
  <text x="135" y="129" text-anchor="middle" font-size="10" fill="#1e40af">plain language</text>

  <!-- Power user / support -->
  <rect x="265" y="55" width="190" height="90" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="360" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">POWER USER / SUPPORT</text>
  <text x="360" y="98" text-anchor="middle" font-size="10" fill="#92400e">"What factors, roughly,</text>
  <text x="360" y="112" text-anchor="middle" font-size="10" fill="#92400e">in what order?"</text>
  <text x="360" y="129" text-anchor="middle" font-size="10" fill="#92400e">a short ranked list</text>

  <!-- Auditor / developer -->
  <rect x="490" y="55" width="190" height="90" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="585" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">AUDITOR / DEVELOPER</text>
  <text x="585" y="98" text-anchor="middle" font-size="10" fill="#5b21b6">full feature weights,</text>
  <text x="585" y="112" text-anchor="middle" font-size="10" fill="#5b21b6">decision boundary,</text>
  <text x="585" y="129" text-anchor="middle" font-size="10" fill="#5b21b6">audit trail</text>

  <!-- depth arrow -->
  <line x1="40" y1="185" x2="680" y2="185" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrowGray3)"/>
  <text x="40" y="205" font-size="11" fill="#6b7280">shallow, default inline</text>
  <text x="680" y="205" text-anchor="end" font-size="11" fill="#6b7280">deep, behind "why?" / "learn more"</text>

  <defs>
    <marker id="arrowGray3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
