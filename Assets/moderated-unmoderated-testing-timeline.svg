<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="Helvetica, Arial, sans-serif">
  <text x="350" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Where each method fits across a design cycle</text>

  <!-- timeline arrow -->
  <line x1="50" y1="130" x2="650" y2="130" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="50" y="150" font-size="11" fill="#6b7280">Early / ambiguous design</text>
  <text x="650" y="150" text-anchor="end" font-size="11" fill="#6b7280">Later / validation at scale</text>

  <!-- Moderated block -->
  <rect x="60" y="55" width="260" height="60" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="190" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">MODERATED</text>
  <text x="190" y="96" text-anchor="middle" font-size="11" fill="#1e3a8a">small n · deep insight · live facilitator</text>
  <text x="190" y="110" text-anchor="middle" font-size="10" fill="#1e40af">can probe "why" in the moment</text>

  <!-- Unmoderated block -->
  <rect x="380" y="55" width="260" height="60" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="510" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">UNMODERATED</text>
  <text x="510" y="96" text-anchor="middle" font-size="11" fill="#065f46">large n · scaled validation · self-guided</text>
  <text x="510" y="110" text-anchor="middle" font-size="10" fill="#047857">fixed script, runs in parallel</text>

  <!-- connecting arrow between blocks -->
  <line x1="320" y1="85" x2="380" y2="85" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>

  <!-- 5-user note -->
  <rect x="180" y="180" width="340" height="50" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="350" y="200" text-anchor="middle" font-size="11" fill="#78350f">Nielsen's rule of thumb: ~5 participants surface ~85%</text>
  <text x="350" y="216" text-anchor="middle" font-size="11" fill="#78350f">of usability problems in a single qualitative round</text>

  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
